services:
  - type: web
    name: sway-api
    env: python
    plan: free
    rootDir: .
    buildCommand: "pip install --upgrade pip"
    startCommand: "python serve.py --host 0.0.0.0 --port $PORT --backend groq --model llama-3.3-70b-versatile --cache-as claude-cli/haiku"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: sway-site
    env: node
    plan: free
    rootDir: site
    buildCommand: "npm ci && npm run build -- --webpack"
    startCommand: "npm run start -- -p $PORT"
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Public URL of the sway-api service. fromService.hostport returns an internal
      # address that only pserv services can reach, so hardcode the public URL instead.
      - key: SWAY_API
        value: https://sway-api-utg2.onrender.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: SWAY_SANDBOX_PAYOUT_EMAIL
        sync: false
