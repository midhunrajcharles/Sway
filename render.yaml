services:
  # Switched from pserv to web so it can run on the free plan.
  # Note: the API is now publicly reachable; the Anthropic key stays in env vars (not URL-exposed).
  - type: web
    name: sway-api
    env: python
    plan: free
    rootDir: .
    buildCommand: "pip install --upgrade pip"
    # --cache-as reuses the committed benchmark cache (recorded on claude-cli/haiku), so benchmarked
    # scenarios answer instantly; anything not cached calls the Anthropic API with the model below.
    startCommand: "python serve.py --host 0.0.0.0 --port $PORT --backend anthropic --model claude-haiku-5-5 --cache-as claude-cli/haiku"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: sway-site
    env: node
    plan: free
    rootDir: site
    # Turbopack hangs on this project, so build with webpack.
    buildCommand: "npm ci && npm run build -- --webpack"
    startCommand: "npm run start -- -p $PORT"
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # fromService hostport is "host:port" with no scheme; sway-api.ts prepends http://.
      - key: SWAY_API
        fromService:
          type: web
          name: sway-api
          property: hostport
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      # Set after registering the webhook; without it production returns 401 on every webhook.
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Sandbox Personal account email that receives publisher payouts.
      - key: SWAY_SANDBOX_PAYOUT_EMAIL
        sync: false
